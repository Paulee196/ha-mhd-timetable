import_lines:
  name: Import timetable lines
  description: >-
    Replace all lines for a stop with the given JSON in one atomic write,
    without touching its vacation periods, vacation groups or
    notifications. Intended for bulk-loading or restoring a full
    timetable that was prepared externally, instead of hand-editing the
    integration's storage file.
  fields:
    config_entry_id:
      name: Stop
      description: The timetable stop to import lines into.
      required: true
      selector:
        config_entry:
          integration: mhd_timetable
    lines:
      name: Lines
      description: >-
        Object keyed by line number/designation, in the same shape the
        integration itself stores it (workday/saturday/sunday/holiday
        minute lists, direction, route, transport_type, etc.). A line may
        optionally include a "vacation" key - an object keyed by vacation
        group name (as shown in the Prazdniny tab), each value that
        line's minute schedule for that group, e.g. {"23": {"vacation":
        {"Omezeny provoz": {"08": [17, 38]}}}}. The named group must
        already exist.
      required: true
      selector:
        object: {}
